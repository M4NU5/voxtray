name: Release

# Build installers for every platform and publish a draft GitHub Release
# whenever a version tag (e.g. v0.1.0) is pushed. You can also run it manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # engine_target: what scripts/build-engine.sh builds the Kokoro
          # engine for. Empty means the runner's own target.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            engine_target: "universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            engine_target: ""
          - platform: windows-latest # Intel/AMD 64-bit
            args: ""
            rust_targets: ""
            engine_target: ""
          - platform: windows-latest # ARM64 (Surface Pro X, etc.)
            args: "--target aarch64-pc-windows-msvc"
            rust_targets: "aarch64-pc-windows-msvc"
            engine_target: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libasound2-dev \
            espeak-ng

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # Bundled next to the app as a sidecar (src-tauri/tauri.engine.conf.json).
      - name: Build the Kokoro engine
        shell: bash
        run: scripts/build-engine.sh ${{ matrix.engine_target }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voxtray ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.engine.conf.json
