[package]
name = "voxtray"
version = "0.2.0"
description = "Select text in any app, press a hotkey, and have it read aloud."
authors = ["Harshal"]
license = "MIT"
repository = "https://github.com/harshaldevvv/voxtray"
edition = "2021"
rust-version = "1.77"

# The Kokoro engine ships as a separate binary (see engine/Cargo.toml).
[workspace]
members = ["engine"]

# The library that Tauri links against. `_lib` avoids a name clash with the bin.
[lib]
name = "voxtray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Clipboard read/write (used to capture the current selection via copy).
arboard = "3"
# Synthesises the Ctrl/Cmd+C keystroke so we can grab the active selection.
enigo = "0.2"
# Plays MP3 (cloud providers) and WAV (local Piper output).
rodio = { version = "0.19", features = ["symphonia-mp3", "symphonia-wav"] }
# Extracting the downloaded Piper engine archives.
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# Stores API keys in the OS keychain (Keychain / Credential Manager / Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# HTTP client for the TTS providers. rustls avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Unicode (UAX #29) sentence boundaries for splitting text into chunks.
unicode-segmentation = "1"

log = "0.4"

# The engine protocol and client. Kokoro itself runs in the separate
# voxtray-engine binary, so its backend stays off here.
voxtray-engine = { path = "engine", default-features = false }
# Unpacking the Kokoro model archive (.tar.bz2). Pure Rust by default.
bzip2 = "0.6"

# The low-level keyboard hook behind the single-key read tap.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Property tests for the chunker.
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# Enable the Tauri devtools in debug builds.
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

